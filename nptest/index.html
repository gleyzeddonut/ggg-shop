<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ListenLink Now Playing test</title>
<style>
  body { font-family: -apple-system, sans-serif; background:#0c0c10; color:#e8e8ec;
         padding:24px; max-width:480px; margin:0 auto; }
  h1 { font-size:18px; }
  p { font-size:14px; line-height:1.5; color:#8a8a96; }
  button { display:block; width:100%; padding:16px; margin:10px 0; font-size:16px;
           border-radius:12px; border:none; background:#4f6bff; color:#fff; }
  button.on { background:#3ddc84; color:#000; }
  #log { font-family:monospace; font-size:11px; color:#3ddc84; white-space:pre-wrap;
         background:#16161c; border-radius:8px; padding:10px; min-height:80px; margin-top:14px; }
</style>
</head>
<body>
<h1>Now Playing test</h1>
<p>Tap ONE variant, then lock the phone. Check: (1) does the tone keep playing?
(2) does the lock screen card show the variant name + icon? Come back, tap Stop,
try the next one. Each variant plays a quiet tone at a different pitch.</p>
<button id="a">Variant A - stream element + silent holder (holder first)</button>
<button id="b">Variant B - stream element + silent holder (holder re-claims)</button>
<button id="c">Variant C - WebAudio direct + silent holder only</button>
<button id="d">Variant D - audible tone from the audio element itself</button>
<button id="e">Variant E - WebAudio tone + near-silent noise holder</button>
<button id="stop" style="background:#22222b;color:#ff5d5d">Stop</button>
<div id="log">ready</div>
<script>
"use strict";
const log = (m) => { document.getElementById('log').textContent += '\n' + m; };
let ctx = null, audioEl = null, npEl = null;

// amp 0 = silence; hz set = sine tone; hz 0 with amp > 0 = noise
function wavUrl(seconds, amp, hz) {
  const rate = 8000, frames = rate * seconds, n = frames * 2;
  const buf = new ArrayBuffer(44 + n);
  const v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE');
  w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, n, true);
  for (let i = 0; amp > 0 && i < frames; i++) {
    const s = hz ? Math.sin(2 * Math.PI * hz * i / rate) * amp : (Math.random() * 2 - 1) * amp;
    v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, s)) * 32767, true);
  }
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
const silentWavUrl = (seconds) => wavUrl(seconds, 0, 0);

function setMeta(name) {
  if (!('mediaSession' in navigator)) { log('no mediaSession API'); return; }
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: name, artist: 'ListenLink test',
      artwork: [
        { src: 'https://gggaudio.store/img/listenlink-icon.png', sizes: '180x180', type: 'image/png' },
        { src: 'https://gggaudio.store/img/listenlink-icon@2x.png', sizes: '360x360', type: 'image/png' }
      ]
    });
    navigator.mediaSession.playbackState = 'playing';
    try { navigator.mediaSession.setActionHandler('play', () => log('action: play')); } catch(_){}
    try { navigator.mediaSession.setActionHandler('pause', () => log('action: pause')); } catch(_){}
    log('metadata set: ' + name);
  } catch (e) { log('metadata FAILED: ' + e.message); }
}

function stop() {
  if (audioEl) { try { audioEl.pause(); } catch(_){} audioEl.srcObject = null; audioEl.remove(); audioEl = null; }
  if (npEl) { try { npEl.pause(); } catch(_){} npEl.remove(); npEl = null; }
  if (ctx) { try { ctx.close(); } catch(_){} ctx = null; }
  document.querySelectorAll('button').forEach(b => b.classList.remove('on'));
  log('stopped');
}

function makeEl(label) {
  const el = document.createElement('audio');
  el.setAttribute('playsinline', '');
  el.style.display = 'none';
  document.body.appendChild(el);
  el.addEventListener('playing', () => log(label + ': playing'));
  el.addEventListener('error', () => log(label + ': ERROR'));
  return el;
}

async function start(variant, hz, name) {
  stop();
  document.getElementById(variant).classList.add('on');
  log('--- starting ' + name + ' ---');

  if (variant === 'd') {
    // No WebAudio at all: the element itself is the (audible) sound source.
    npEl = makeEl('tone-el');
    npEl.loop = true;
    npEl.volume = 0.35;
    npEl.src = wavUrl(30, 0.5, 440);
    await npEl.play().catch(e => log('tone-el play failed: ' + e.message));
    setMeta(name);
    npEl.addEventListener('playing', () => setMeta(name));
    return;
  }

  if (variant === 'e') {
    // Real audio via WebAudio; the holder loops -70dB noise so WebKit sees a
    // technically-audible file element (inaudible to humans).
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc2 = ctx.createOscillator();
    osc2.frequency.value = 770;
    const g2 = ctx.createGain();
    g2.gain.value = 0.08;
    osc2.connect(g2); g2.connect(ctx.destination); osc2.start();
    npEl = makeEl('noise-holder');
    npEl.loop = true;
    npEl.src = wavUrl(30, 0.0003, 0);
    await npEl.play().catch(e => log('holder play failed: ' + e.message));
    await ctx.resume();
    setMeta(name);
    npEl.addEventListener('playing', () => setMeta(name));
    return;
  }

  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  osc.frequency.value = hz;
  const gain = ctx.createGain();
  gain.gain.value = 0.08;
  osc.connect(gain);
  osc.start();

  npEl = makeEl('holder');
  npEl.loop = true;
  npEl.src = silentWavUrl(60);

  if (variant === 'c') {
    gain.connect(ctx.destination);
    await npEl.play().catch(e => log('holder play failed: ' + e.message));
  } else {
    audioEl = makeEl('stream');
    const dest = ctx.createMediaStreamDestination();
    gain.connect(dest);
    audioEl.srcObject = dest.stream;
    if (variant === 'a') {
      await npEl.play().catch(e => log('holder play failed: ' + e.message));
      await audioEl.play().catch(e => log('stream play failed: ' + e.message));
    } else {
      await audioEl.play().catch(e => log('stream play failed: ' + e.message));
      await npEl.play().catch(e => log('holder play failed: ' + e.message));
      // re-claim: restart the holder so it is the most recent playback
      audioEl.addEventListener('playing', () => {
        setTimeout(() => {
          if (npEl) { npEl.pause(); npEl.play().catch(()=>{}); log('holder re-claimed'); }
        }, 500);
      }, { once: true });
    }
  }
  await ctx.resume();
  setMeta(name);
  npEl.addEventListener('playing', () => setMeta(name));
  if (audioEl) audioEl.addEventListener('playing', () => setMeta(name));
}

document.getElementById('a').onclick = () => start('a', 440, 'NPTEST A');
document.getElementById('b').onclick = () => start('b', 550, 'NPTEST B');
document.getElementById('c').onclick = () => start('c', 660, 'NPTEST C');
document.getElementById('d').onclick = () => start('d', 440, 'NPTEST D');
document.getElementById('e').onclick = () => start('e', 770, 'NPTEST E');
document.getElementById('stop').onclick = stop;
log(navigator.userAgent);
</script>
</body>
</html>
